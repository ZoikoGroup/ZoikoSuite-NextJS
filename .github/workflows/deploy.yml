name: Deploy Zoiko Suite Website

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          # Default is 10m; install + next build (compile + TypeScript) exceeds that on the server
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/zoiko-suite/app
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            rm -rf .next
            npm install
            npm run build
            pm2 restart zoiko-suite
            pm2 save
